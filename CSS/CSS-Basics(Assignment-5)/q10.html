<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Complete Layout</title>
  <link rel="stylesheet" href="Q10.css">
</head>
<body>
  <header>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Services</a>
      <a href="#">Contact</a>
    </nav>
  </header>
  <section class="hero">
    <h1>Welcome to My Site</h1>
  </section>
  <section class="about">
    <div class="text">About content here</div>
    <div class="image"><img src="about.jpg" alt="About"></div>
  </section>
  <section class="services">
    <div class="service">Service 1</div>
    <div class="service">Service 2</div>
    <div class="service">Service 3</div>
  </section>
  <section class="contact">
    <form>
      <input type="text" placeholder="Name">
      <input type="email" placeholder="Email">
      <textarea placeholder="Message"></textarea>
      <button>Send</button>
    </form>
  </section>
  <footer>
    <p>&copy; 2026 My Website</p>
  </footer>
</body>
</html>

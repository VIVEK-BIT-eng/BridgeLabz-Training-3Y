<!DOCTYPE html>
<html>
<head>
  <title>Product Catalog</title>
</head>
<body>

  <h1>Online Store - Product Catalog</h1>

  <table border="1">
    <tr>
      <th>Product Name</th>
      <th>Description</th>
      <th>Price</th>
      <th>Availability</th>
      <th>Image</th>
    </tr>
    <tr>
      <td>Smartphone</td>
      <td>Latest Android phone</td>
      <td>$500</td>
      <td>In Stock</td>
      <td><img src="phone.jpg" alt="Smartphone" width="80"></td>
    </tr>
    <tr>
      <td>Laptop</td>
      <td>High performance laptop</td>
      <td>$1000</td>
      <td>Out of Stock</td>
      <td><img src="laptop.jpg" alt="Laptop" width="80"></td>
    </tr>
    <tr>
      <td colspan="2">Headphones</td>
      <td>$100</td>
      <td rowspan="2">Available</td>
      <td><img src="headphones.jpg" alt="Headphones" width="80"></td>
    </tr>
    <tr>
      <td colspan="2">Smartwatch</td>
      <td>$200</td>
      <td><img src="watch.jpg" alt="Smartwatch" width="80"></td>
    </tr>
  </table>

</body>
</html>

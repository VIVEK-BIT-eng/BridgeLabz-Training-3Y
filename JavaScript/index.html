    // array
    let colors = ["red", "green", "blue"];
    console.log(colors[0]); // "red"
    console.log(colors.length); // 3
    colors.push("yellow"); // Adds "yellow" to the end of the array
    console.log(colors.length); // 4
    colors.pop(); // removes the last element
    console.log(colors.length); // 3
    colors.unshift("purple"); // adds "purple" to the beginning of the array
    console.log(colors.length); // 4
    colors.shift(); // removes the first element
    console.log(colors.length); // 3
    for (let i = 0; i < colors.length; i++) {
        console.log(colors[i]); // Prints each color in the array
    }

    for (let color of colors) {
        console.log(color); // Prints each color in the array
    }

    colors.forEach(function(color) {
        console.log(color); // Prints each color in the array
    });
    console.log(colors.includes("green")); // true (checks if "green" is in the array)
    colors.indexOf("blue"); // 2 (returns the index of "blue")
    colors.reverse(); // reverses the array
    console.log(colors); // ["blue", "green", "red"]
    colors.pop(); // removes the last element
    console.log(colors); // ["blue", "green"]

        return num1 * num2;
    };

    let result2 = multiplyNumbers(5, 10);
